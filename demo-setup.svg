<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      .term { font-family: 'JetBrains Mono', 'Menlo', 'Consolas', monospace; font-size: 13px; }
      .bold { font-weight: 700; }
      .dim { fill: #888; }
      .white { fill: #e0e0e0; }
      .green { fill: #50fa7b; }
      .yellow { fill: #f1fa8c; }
      .red { fill: #ff5555; }
      .cyan { fill: #8be9fd; }
      .prompt { fill: #bd93f9; }
      .blue { fill: #6272a4; }
    </style>
  </defs>
  <!-- Background -->
  <rect width="820" height="400" rx="10" fill="#282a36"/>
  <!-- Title bar -->
  <rect width="820" height="36" rx="10" fill="#21222c"/>
  <rect y="26" width="820" height="10" fill="#21222c"/>
  <circle cx="20" cy="18" r="6" fill="#ff5555"/>
  <circle cx="40" cy="18" r="6" fill="#f1fa8c"/>
  <circle cx="60" cy="18" r="6" fill="#50fa7b"/>
  <text x="410" y="22" text-anchor="middle" class="term dim" font-size="12">context-drift setup</text>

  <!-- Terminal content -->
  <g transform="translate(20, 56)">
    <!-- Install -->
    <text y="0" class="term blue bold">Install</text>

    <text y="26" class="term prompt">$</text>
    <text x="16" y="26" class="term white">npm install -g @geekiyer/context-drift</text>

    <!-- Setup -->
    <text y="62" class="term blue bold">Set up the skill + auto-check hook</text>

    <text y="88" class="term prompt">$</text>
    <text x="16" y="88" class="term white">context-drift setup --hook</text>

    <text y="114" class="term green">Installed /drift-check skill to .claude/skills/drift-check (project)</text>
    <text y="130" class="term green">Installed auto-check hook to .claude/settings.json</text>
    <text y="146" class="term dim">Claude Code will warn you when context files drift at the start of each session.</text>

    <!-- Usage in Claude Code -->
    <text y="182" class="term blue bold">Use it</text>

    <text y="208" class="term prompt">claude&gt;</text>
    <text x="60" y="208" class="term white">/drift-check</text>

    <text y="240" class="term dim">Running deterministic checks...</text>
    <text y="258" class="term yellow">  CLAUDE.md:17 — MISSING_PATH — "src/nonexistent" not found</text>
    <text y="276" class="term red">  CLAUDE.md:23 — DEAD_COMMAND — "npm run test:e2e" script not found</text>
    <text y="294" class="term dim">Running semantic checks through your LLM...</text>
    <text y="312" class="term red">  CLAUDE.md:3 — SEMANTIC_DRIFT — Claims Express but codebase uses Hono</text>

    <text y="340" class="term yellow">Drift Score: 68/100</text>
  </g>
</svg>
